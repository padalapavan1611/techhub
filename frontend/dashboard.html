<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TechHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">TechHub</div>
        <div class="navbar-links">
            <a href="dashboard.html">Search</a>
            <a href="history.html">History</a>
            <a href="saved.html">Saved</a>
            <a href="profile.html">Profile</a>
            <button class="btn-icon" onclick="toggleTheme()" id="theme-icon">🌙</button>
            <a href="#" onclick="logout()" style="color:var(--danger);">Logout</a>
        </div>
    </nav>
    
    <div class="container" style="min-height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px 32px 80px;">
        
        <h1 style="font-size:48px; font-weight:700; margin-bottom:56px; text-align:center; letter-spacing:-0.02em;">What would you like to learn?</h1>
        
        <div class="search-box" style="max-width:1000px; width:100%; margin-bottom:40px;">
            <input type="text" id="search-input" placeholder="Ask any technical question..." style="padding:24px 32px; font-size:19px; height:72px; border-radius:14px;">
            <button class="btn-primary" onclick="performSearch()" style="padding:0 48px; font-size:18px; font-weight:600; height:72px; border-radius:14px;">Search</button>
        </div>
        
        <div class="suggestions" style="max-width:1000px; gap:14px; margin-bottom:56px;">
            <span class="chip" onclick="quickSearch('How to undo git commit')" style="padding:14px 28px; font-size:16px;">git commit</span>
            <span class="chip" onclick="quickSearch('Python read CSV')" style="padding:14px 28px; font-size:16px;">Python CSV</span>
            <span class="chip" onclick="quickSearch('JavaScript array methods')" style="padding:14px 28px; font-size:16px;">JS arrays</span>
            <span class="chip" onclick="quickSearch('SQL join query')" style="padding:14px 28px; font-size:16px;">SQL join</span>
            <span class="chip" onclick="quickSearch('Docker container')" style="padding:14px 28px; font-size:16px;">Docker</span>
            <span class="chip" onclick="quickSearch('React useState')" style="padding:14px 28px; font-size:16px;">React</span>
            <span class="chip" onclick="quickSearch('Center div CSS')" style="padding:14px 28px; font-size:16px;">CSS center</span>
        </div>
        
        <p style="color:var(--text-muted); font-size:15px; text-align:center; max-width:800px;">
            Searches Stack Overflow, GitHub, Reddit, Wikipedia, Dev.to, GeeksforGeeks, Medium, YouTube, DuckDuckGo, and Gemini AI in real-time.
        </p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
