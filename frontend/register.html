<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TechHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">TechHub</div>
        <div class="navbar-links">
            <button class="btn-icon" onclick="toggleTheme()" id="theme-icon">🌙</button>
            <a href="index.html">Home</a>
        </div>
    </nav>
    
    <div class="auth-container">
        <h2 style="text-align:center; margin-bottom:8px; font-size:26px; font-weight:600;">Create Account</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:32px; font-size:14px;">Join TechHub for free</p>
        
        <div style="margin-bottom:20px;">
            <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px; font-weight:500;">Full Name</label>
            <input type="text" id="register-name" placeholder="John Doe">
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px; font-weight:500;">Email</label>
            <input type="email" id="register-email" placeholder="you@example.com">
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px; font-weight:500;">Password</label>
            <input type="password" id="register-password" placeholder="Min 6 characters">
        </div>
        
        <button class="btn-primary" onclick="register()" style="width:100%; margin-bottom:20px;">Create Account</button>
        
        <p style="text-align:center; font-size:14px; color:var(--text-secondary);">
            Already have account? <a href="login.html">Sign in</a>
        </p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
