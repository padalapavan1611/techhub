<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TechHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">TechHub</div>
        <div class="navbar-links">
            <button class="btn-icon" onclick="toggleTheme()" id="theme-icon">🌙</button>
            <a href="index.html">Home</a>
        </div>
    </nav>
    
    <div class="auth-container">
        <h2 style="text-align:center; margin-bottom:8px; font-size:26px; font-weight:600;">Welcome back</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom:32px; font-size:14px;">Sign in to your account</p>
        
        <div style="margin-bottom:20px;">
            <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px; font-weight:500;">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com">
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px; font-weight:500;">Password</label>
            <input type="password" id="login-password" placeholder="Your password">
        </div>
        
        <button class="btn-primary" onclick="login()" style="width:100%; margin-bottom:20px;">Sign In</button>
        
        <p style="text-align:center; font-size:14px; color:var(--text-secondary);">
            No account? <a href="register.html">Create one</a>
        </p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
